name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（手动触发时必填，例如 v0.1.0）
        required: true
      draft:
        description: 以草稿形式发布
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # tag 一推就打包发布，所以门禁必须在同一个 workflow 里先跑一遍：
  # CI 是 push/PR 触发的，跟 tag 不联动。
  gate:
    name: 门禁
    runs-on: windows-latest
    steps:
      # 手动触发时检查的是指定 tag，否则会打出「名为 v0.1.0、内容来自 HEAD」的包。
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 版本由 package.json 的 packageManager 决定，不要再传 version（会冲突硬失败）。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      - name: 构建 release 核心
        run: cargo build --release -p tl-core

      - name: 准备 sidecar
        run: ./scripts/bundle-sidecars.ps1
        shell: pwsh

      - name: 格式检查（Agent）
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Clippy（Agent）
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Agent 测试
        working-directory: src-tauri
        run: cargo test

      # 拆成两步：pwsh 在 `run: |` 里只在末尾看 $LASTEXITCODE，
      # 前一条失败会被后一条的成功掩盖。
      - name: 架构检查（自检）
        run: node tools/msocheck/msocheck.mjs --selftest
      - name: 架构检查
        run: node tools/msocheck/msocheck.mjs

      # 与 ci.yml 保持一致：打包路径的问题只有真跑一次 build 才暴露。
      - name: 打包编译验证
        run: pnpm tauri build --no-bundle

  build:
    name: 构建安装包
    needs: gate
    runs-on: windows-latest
    steps:
      # 手动触发时检查的是指定 tag，否则会打出「名为 v0.1.0、内容来自 HEAD」的包。
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 版本由 package.json 的 packageManager 决定，不要再传 version（会冲突硬失败）。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: 构建核心（release）
        run: cargo build --release -p tl-core

      - name: 打包 Agent
        run: pnpm tauri build

      # src-tauri 自成 workspace root，产物落在 src-tauri/target 下。
      - name: 定位产物
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe
          if (-not $exe) { throw "NSIS 安装包未生成，检查 tauri bundle.targets" }
          $exe | ForEach-Object { Write-Host "installer: $($_.FullName)" }

      - name: 便携版
        shell: pwsh
        run: |
          $main = "src-tauri/target/release/Threadline.exe"
          $core = "src-tauri/target/release/tl-core.exe"
          if (-not (Test-Path $main)) { throw "主程序缺失: $main（检查 mainBinaryName）" }
          if (-not (Test-Path $core)) { throw "核心缺失: $core" }
          $stage = "portable/Threadline"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $main, $core $stage
          Copy-Item "LICENSE", "README.md", "THIRD_PARTY-NOTICES.md" $stage
          # THIRD_PARTY-NOTICES 里全是 licenses/ 相对链接，缺了这一层就是断链。
          Copy-Item "licenses" $stage -Recurse
          Compress-Archive -Path $stage -DestinationPath "Threadline_${{ inputs.tag || github.ref_name }}_x64-portable.zip" -Force

      # 哈希必须覆盖全部发布物，且在便携包生成之后。
      - name: 生成校验和
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter *.exe
          $files += Get-ChildItem "Threadline_*_x64-portable.zip"
          $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding utf8 SHA256SUMS.txt
          Get-Content SHA256SUMS.txt | Write-Host

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            Threadline_*_x64-portable.zip
            SHA256SUMS.txt
          body: |
            安装包**未做代码签名**，首次运行会出现 SmartScreen「未知发布者」提示：
            点「更多信息 → 仍要运行」即可。请先用 `SHA256SUMS.txt` 核对文件。

            安装后主程序名为 `Threadline.exe`。数据目录为 `%PUBLIC%\Threadline`。
