name: 功能建议
description: 提出一个使用场景或改进想法
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 你想解决什么场景
      description: 描述现在的做法与不方便之处，比描述具体功能更有用
      placeholder: 我有十几个内网面板，每次要在浏览器里记不同端口……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案（可选）
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 你现在怎么绕过去（可选）
      description: 现有替代做法，能帮我们判断优先级
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 界面 / 交互
        - 转发能力
        - 域名访问 / 证书
        - 安装与自启
        - 其他
    validations:
      required: true
