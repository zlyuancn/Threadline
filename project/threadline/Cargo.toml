[workspace]
resolver = "2"
members = [
    "crates/tl-protocol",
    "crates/tl-core",
    "crates/tl-wake",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
license-file = "LICENSE"
authors = ["zlyuancn"]
repository = "https://github.com/zlyuancn/Threadline"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
base64 = "0.22"
fs2 = "0.4"
getrandom = "0.2"
# 用 ring 作 crypto backend：默认的 aws-lc-sys 需要 NASM 汇编器，ring 是纯 Rust + C，无需额外工具链。
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
# 本地 CA 与入口 TLS 终止（②）：同样必须走 ring；`tls12` 是 tokio-rustls 的 default feature，
# 关掉 default 后要显式打开，否则只剩 TLS 1.3。
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls-pemfile = "2"
sha1 = "0.10"
sha2 = "0.10"
time = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process"] }
tracing = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

tl-protocol = { path = "crates/tl-protocol" }
